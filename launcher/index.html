<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dizen</title>
  <!-- Aplique a preferência antes de existir conteúdo para pintar. -->
  <!-- Personalização local opcional (window.DIZEN_LOCAL): ver js/local.js. -->
  <script src="js/local.js?v=20261118-1"></script>
  <script src="js/themes.js?v=20261118-1"></script>
  <script>DizenThemes.loadTheme();</script>
  <link rel="stylesheet" href="css/style.css?v=20261112-7">
  <link rel="stylesheet" href="css/themes/dizen.css?v=20261112-7">
  <link rel="stylesheet" href="css/themes/oled.css?v=20261112-7">
  <link rel="stylesheet" href="css/themes/wii.css?v=20261117-3">
  <link rel="stylesheet" href="css/themes/appletv.css?v=20261112-7">
  <link rel="stylesheet" href="css/themes/retro.css?v=20261112-7">
  <link rel="stylesheet" href="css/themes/nord.css?v=20261112-7">
  <link rel="stylesheet" href="css/themes/win95.css?v=20261112-7">
  <link rel="stylesheet" href="css/themes/xp.css?v=20261112-7">
</head>
<body>
  <header class="topbar">
    <h1 class="brand" aria-label="Dizen">
      <!-- Marca: mascote Eraserhead + lettering. Cores por tema via --mark-*. -->
      <svg class="brand-mascot" viewBox="23 9 59 80" aria-hidden="true">
        <path class="mascot-body" d="M38 12H60A12 12 0 0 1 72 24V52.88A6.5 6.5 0 1 1 72 63.12V72A14 14 0 0 1 58 86H40A14 14 0 0 1 26 72V24A12 12 0 0 1 38 12Z"/>
        <g class="mascot-eyes">
          <rect x="36.5" y="45.6" width="6.1" height="16.8" rx="3.05"/>
          <rect x="53.5" y="45.6" width="6.1" height="16.8" rx="3.05"/>
        </g>
      </svg>
      <svg class="brand-word" viewBox="0 0 116 38" aria-hidden="true">
        <g class="word-ink">
          <path d="M5 6V32H11A13 13 0 0 0 11 6Z"/>
          <path d="M37 17V32"/>
          <path d="M47 16H61L47 32H61"/>
          <path d="M70 24H86A8 8 0 1 0 83.6 29.7"/>
          <path d="M96 32V16M96 23.5A7.5 7.5 0 0 1 111 23.5V32"/>
        </g>
        <circle class="word-dot" cx="37" cy="7" r="3.6"/>
      </svg>
      <span class="brand-text">Dizen</span>
    </h1>
    <div class="topbar-right">
      <div class="clock" id="clock" role="img" aria-label="Horário"></div>
      <button class="gear" id="settings-btn" title="Configurações" aria-label="Configurações">&#9881;</button>
    </div>
  </header>

  <main class="stage">
    <div class="grid" id="grid" role="grid" aria-label="Aplicativos"></div>
    <p class="empty" id="empty" hidden>Nenhum app encontrado.</p>
  </main>

  <canvas class="apple-shelf-tint" id="apple-shelf-tint" width="384" height="128" aria-hidden="true" hidden></canvas>
  <div class="apple-shelf-art" id="apple-shelf-art" aria-hidden="true" hidden>
    <img id="apple-shelf-image" alt="" hidden>
    <span id="apple-shelf-fallback" hidden></span>
  </div>
  <div class="apple-shelf-title" id="apple-shelf-title" aria-hidden="true" hidden></div>

  <div class="launch-status" id="launch-status" role="status" aria-live="polite" hidden></div>

  <footer class="hintbar">
    <span>&larr;&uarr;&darr;&rarr; navegar</span>
    <span>OK abrir</span>
    <span>&uarr; no topo: configura&ccedil;&otilde;es</span>
  </footer>
  <div class="date" id="date"><span class="date-long"></span><span class="date-short"></span></div>

  <!-- Música do tema Canais: só se js/local.js indicar um arquivo (DIZEN_LOCAL.ambience). -->
  <audio id="wii-ambience" preload="none" loop></audio>

  <div class="overlay" id="settings-overlay" hidden>
    <div class="panel">
      <h2 class="panel-title">Configurações</h2>
      <div class="settings-tabs" aria-label="Seções de configurações">
        <button class="settings-tab active" id="theme-tab" type="button">Temas</button>
        <button class="settings-tab" id="order-tab" type="button">Ordem dos apps</button>
        <button class="settings-tab" id="hdmi-tab" type="button">Entradas HDMI</button>
      </div>
      <ul class="theme-list settings-list" id="theme-list"></ul>
      <ul class="theme-list settings-list app-order-list" id="app-order-list" hidden></ul>
      <ul class="theme-list settings-list hdmi-list" id="hdmi-list" hidden></ul>
      <p class="panel-hint" id="panel-hint">←/→ seção · ↑/↓ escolher · OK selecionar · Voltar fechar</p>
    </div>
  </div>

  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <script src="js/apps.js?v=20261112-7"></script>
  <script src="js/wii-gl.js?v=20261117-1"></script>
  <script src="js/main.js?v=20261118-1"></script>
</body>
</html>
